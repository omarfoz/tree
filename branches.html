<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="فروع عائلة السويلم - الأجداد والممثلين والتوزيع">
<title>فروع العائلة — شجرة عائلة السويلم</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<main class="container">

  <div class="page-hero">
    <h1>فروع العائلة</h1>
    <p>٣٤ فرعاً متفرعاً من الجد سويلم، مع ممثلي الفروع وأجدادها وتوزيعاتها عبر السنوات.</p>
  </div>

  <!-- Branch Sizes Chart -->
  <div class="chart-container mb-3" style="min-height:400px;">
    <canvas id="branchChart"></canvas>
  </div>

  <!-- Representatives -->
  <section class="section">
    <div class="section-header">
      <div>
        <h2 class="section-title">ممثلو فروع الشجرة</h2>
        <p class="section-desc">سفراء الصندوق وممثلو الفروع حسب الإصدار الثالث ١٤٤٨هـ</p>
      </div>
    </div>
    <div class="grid grid-2" id="reps-grid"></div>
  </section>

  <!-- Branch Table -->
  <section class="section">
    <div class="section-header">
      <div>
        <h2 class="section-title">أرقام وأسماء أجداد الفروع</h2>
        <p class="section-desc">من الجد سويلم ومواقعهم في الشجرة</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-muted" style="font-size:0.85rem;">الترتيب:</span>
        <select id="branch-sort" class="btn btn-ghost btn-sm" style="height:32px;padding:0 12px;">
          <option value="num">رقم الفرع</option>
          <option value="size">الأكبر</option>
          <option value="size-asc">الأصغر</option>
          <option value="alpha">أبجدي</option>
        </select>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="overflow-x-auto">
        <table class="data-table" id="branch-table">
          <thead>
            <tr>
              <th>الفرع</th>
              <th>جد الفرع</th>
              <th>الموقع</th>
              <th>العدد ١٤٤٨</th>
              <th>معدل نمو</th>
            </tr>
          </thead>
          <tbody id="branch-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<script src="js/app.js"></script>
<script>
let branchesData = [];
let repsData = [];

async function load() {
  const branchesRes = await fetch('data/branches.json').then(r => r.json());
  const repsRes = await fetch('data/representatives.json').then(r => r.json());
  branchesData = branchesRes.branches;
  repsData = repsRes;

  renderBranchChart();
  renderReps();
  renderTable('num');
}

function renderBranchChart() {
  const labels = branchesData.map(b => 'فرع ' + b.number);
  const data1448 = branchesData.map(b => b.size1448);
  const data1445 = branchesData.map(b => b.sizesByYear['1445']);

  new Chart(document.getElementById('branchChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: '١٤٤٨هـ', data: data1448, backgroundColor: 'rgba(13,118,189,0.8)', borderRadius: 4, barPercentage: 0.7 },
        { label: '١٤٤٥هـ', data: data1445, backgroundColor: 'rgba(74,205,123,0.6)', borderRadius: 4, barPercentage: 0.7 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', rtl: true, labels: { font: { family: "'IBM Plex Sans Arabic'" } } },
        tooltip: { rtl: true }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: "'IBM Plex Sans Arabic'", size: 10 } } },
        y: { beginAtZero: true, grid: { color: 'rgba(47,36,21,0.06)' } }
      }
    }
  });
}

function renderReps() {
  const container = document.getElementById('reps-grid');
  repsData.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card animate-in';
    card.style.animationDelay = (i * 0.04) + 's';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <span class="badge ${r.isSuperRepresentative ? 'badge-gold' : 'badge-green'}">${r.isSuperRepresentative ? 'ممثل عام' : 'ممثل فرع ' + r.num}</span>
        <span class="text-muted" style="font-size:0.8rem;">#${r.treeNumber}</span>
      </div>
      <div style="font-size:1.1rem;font-weight:700;color:var(--color-ink);margin-bottom:6px;">${r.nameShort}</div>
      <div class="text-muted" style="font-size:0.85rem;">${r.name}</div>
      <div class="mt-2" style="font-size:0.8rem;color:var(--color-ink-muted);">${r.branch}</div>
    `;
    container.appendChild(card);
  });
}

function renderTable(sortBy) {
  let sorted = [...branchesData];
  if (sortBy === 'size') sorted.sort((a, b) => b.size1448 - a.size1448);
  else if (sortBy === 'size-asc') sorted.sort((a, b) => a.size1448 - b.size1448);
  else if (sortBy === 'alpha') sorted.sort((a, b) => a.ancestor.localeCompare(b.ancestor, 'ar'));

  const tbody = document.getElementById('branch-tbody');
  tbody.innerHTML = '';
  sorted.forEach(b => {
    const growth = ((b.size1448 - b.sizesByYear['1445']) / b.sizesByYear['1445'] * 100).toFixed(1);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="number" style="font-weight:700;">${b.number}</td>
      <td class="name-cell">${b.ancestor}</td>
      <td class="text-muted">${b.location}</td>
      <td class="number">${b.size1448}</td>
      <td><span class="badge badge-green">+${growth}%</span></td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('branch-sort').addEventListener('change', (e) => {
  renderTable(e.target.value);
});

load();
</script>
</body>
</html>
